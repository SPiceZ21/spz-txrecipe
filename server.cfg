# ── Server Endpoints ──────────────────────────────────────────────────────
{{serverEndpoints}}

# ── License & Database ────────────────────────────────────────────────────
# txAdmin injects the key into its `svLicense` placeholder — that exact name,
# in double braces, on the line below. Any other name (svLicenseKey, ...) is left
# in the file verbatim, the key typed during setup goes nowhere, and the server
# fails its license check on boot. Do NOT write the placeholder in a comment:
# txAdmin substitutes it everywhere in this file, comments included, which would
# print the key into the comment as well.
sv_licenseKey {{svLicense}}
set mysql_connection_string "{{dbConnectionString}}"

# ── Server Identity ───────────────────────────────────────────────────────
sv_hostname "{{serverName}}"
sets sv_projectName "[{{recipeName}}] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "racing, spicez, spz"
sets locale "root-AQ"

# ── Branding ──────────────────────────────────────────────────────────────
load_server_icon Logo.png
sets banner_detail "https://raw.githubusercontent.com/SPiceZ21/spz-txrecipe/main/Banner.png"
sets banner_connecting "https://raw.githubusercontent.com/SPiceZ21/spz-txrecipe/main/Banner.png"

# ── Slots & Build ─────────────────────────────────────────────────────────
sv_maxclients {{maxClients}}
sv_enforceGameBuild 3407
set resources_useSystemChat true

# OneSync is REQUIRED — pma-voice, routing buckets, and the race engine's
# server-side entity handling all depend on it. Without this, proximity voice
# silently does nothing.
set onesync on

# ── Security ──────────────────────────────────────────────────────────────
# Reject client-side state bag modifications. All SPiceZ state bags are
# server-written; clients only read, so strict mode is safe here.
setr sv_stateBagStrictMode true

# ── SPiceZ Convars ────────────────────────────────────────────────────────
set spz_debug "{{spzDebug}}"

# Discord bot token for pulling player avatars/names (spz-identity).
# PRIVATE — use `set` (never setr), it must not replicate to clients.
# Create a bot at https://discord.com/developers, paste its token here.
set spz_discord_token ""

# Base UI theme — re-skins every SPiceZ NUI at once (spz-core reads these,
# pushes to every client on connect, and re-pushes automatically whenever
# spz-core (re)starts — a full server restart or a bare `restart spz-core`
# both pick it up with no manual step). Change live with `/spz reloadtheme`.
# These are the SPiceZ brand defaults — edit in place to re-skin the server.
#
# `setr` rather than `set` is a small optimisation for the loading screen: it is
# painted before any push from spz-core could reach the client, so it reads
# these convars directly instead. A plain `set` also works — spz-loading then
# asks the server for them over one round trip. Hex only — "#rrggbb" or "#rgb";
# anything else is ignored and that colour stays at its default.
setr spz_theme_accent  "#ff6200"
setr spz_theme_accent2 "#ff9142"
setr spz_theme_bg      "#060608"
setr spz_theme_bg2     "#0a0b0f"
setr spz_theme_danger  "#ff4d5e"
setr spz_theme_gold    "#f59e0b"

# ── Voice (pma-voice) ─────────────────────────────────────────────────────
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly false
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1

# ── CFX Default Resources ─────────────────────────────────────────────────
ensure mapmanager
# spz-chat replaces the default chat box entirely (queue/invite/DM, real
# command routing, and it catches chat:addMessage for compat) — don't run
# both, they'd fight over the T keybind.
ensure spawnmanager
ensure sessionmanager
# basic-gamemode auto-spawns the player at a random map spawnpoint (where they
# fall through the world). spz-spawn owns spawning, so it stays OFF.
# ensure basic-gamemode
ensure hardcap
ensure baseevents

# ── Map (IPLs) ────────────────────────────────────────────────────────────
# Loads the IPLs and interiors the base map leaves unrequested: without it
# FiveM shows holes, missing buildings and see-through ground in exactly the
# areas a racing server drives through. Started before anything SPiceZ so the
# world is whole by the time a race spawns anyone into it.
ensure bob74_ipl

