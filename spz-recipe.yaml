name: SPiceZ-Core Racing
version: "3.0.0"
author: SPiceZ21
description: >
  Open-source, modular racing framework for FiveM.
  Installs all dependencies, SPZ modules, and a production-ready
  server.cfg in one step. The schema applies itself on first boot.
  v3.0.0: spz-lib dropped for ox_lib; illenium-appearance replaced by
  fivem-appearance; spz-orb/spz-stance/spz-tablet removed; schema moved
  to spz-core migrations.

variables:
  spzDebug: "false"
  recipeName: "SPiceZ-Core"
  recipeDescription: "Open-source FiveM Racing Framework"

tasks:
  # ── 1. Recipe Assets ─────────────────────────────────────────────────────────
  - action: download_github
    src: https://github.com/SPiceZ21/spz-txrecipe
    dest: ./tmp/recipe

  # ── 2. Base Server Data ───────────────────────────────────────────────────────
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]

  # ── 3. Database ───────────────────────────────────────────────────────────────
  # Only the connection is set up here. The schema is owned by spz-core:
  # spz-core/migrations/*.sql are applied automatically on first boot and
  # tracked in the `spz_migrations` table (idempotent, safe on every restart).
  - action: connect_database

  # ── 4. Dependencies ───────────────────────────────────────────────────────────
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[dependencies]

  - action: download_file
    url: https://github.com/TomGrobbe/vMenu/releases/download/v3.8.8/vMenu-3.8.8.zip
    path: ./tmp/vMenu.zip
  - action: unzip
    src: ./tmp/vMenu.zip
    dest: ./resources/vMenu

  # ox_lib: SPiceZ fork (not the upstream overextended release) — it carries
  # our own Mantine theme (web/src/theme/index.ts: orange accent, near-black
  # surfaces, Panchang headings) so lib.notify/showContext/alertDialog/etc.
  # render on-brand everywhere instead of stock ox_lib's default palette.
  # web/build is committed, so this clones as-is like fivem-appearance below —
  # no build step here.
  - action: download_github
    src: https://github.com/SPiceZ21/ox_lib
    dest: ./resources/[dependencies]/ox_lib

  # fivem-appearance: SPiceZ fork (standalone, no framework required).
  # Pulls OUR built fork instead of upstream v1.2.1 — it carries the preview
  # flicker fix, the redesigned SPiceZ UI, the cloth thumbnail grid and 3D
  # drag-rotate. The repo must have the built bundles committed (game/dist +
  # web/dist); the recipe clones it as-is (no build step here).
  - action: download_github
    src: https://github.com/SPiceZ21/fivem-appearance
    dest: ./resources/[dependencies]/fivem-appearance

  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    dest: ./resources/[dependencies]/pma-voice

  - action: download_github
    src: https://github.com/citizenfx/screenshot-basic
    dest: ./resources/[dependencies]/screenshot-basic

  - action: download_github
    src: https://github.com/itschip/screencapture
    dest: ./resources/[dependencies]/screencapture

  # ── 5. SPiceZ-Core Modules ────────────────────────────────────────────────────
  # Modules with Production Releases (UI Built)
  - action: download_file
    url: https://github.com/SPiceZ21/spz-loading/releases/latest/download/spz-loading.zip
    path: ./tmp/spz-loading.zip
  - action: unzip
    src: ./tmp/spz-loading.zip
    dest: ./resources/[spz]

  - action: download_github
    src: https://github.com/SPiceZ21/spz-core
    dest: ./resources/[spz]/spz-core

  - action: download_file
    url: https://github.com/SPiceZ21/spz-spawn/releases/latest/download/spz-spawn.zip
    path: ./tmp/spz-spawn.zip
  - action: unzip
    src: ./tmp/spz-spawn.zip
    dest: ./resources/[spz]

  - action: download_github
    src: https://github.com/SPiceZ21/spz-identity
    dest: ./resources/[spz]/spz-identity

  - action: download_github
    src: https://github.com/SPiceZ21/spz-appearance
    dest: ./resources/[spz]/spz-appearance

  - action: download_github
    src: https://github.com/SPiceZ21/spz-vehicles
    dest: ./resources/[spz]/spz-vehicles

  - action: download_github
    src: https://github.com/SPiceZ21/spz-races
    dest: ./resources/[spz]/spz-races

  - action: download_github
    src: https://github.com/SPiceZ21/spz-progression
    dest: ./resources/[spz]/spz-progression

  - action: download_file
    url: https://github.com/SPiceZ21/spz-poll/releases/latest/download/spz-poll.zip
    path: ./tmp/spz-poll.zip
  - action: unzip
    src: ./tmp/spz-poll.zip
    dest: ./resources/[spz]

  - action: download_file
    url: https://github.com/SPiceZ21/spz-raceUI/releases/latest/download/spz-raceUI.zip
    path: ./tmp/spz-raceUI.zip
  - action: unzip
    src: ./tmp/spz-raceUI.zip
    dest: ./resources/[spz]

  # No ui/ folder — pure ox_lib menu (lib.registerContext), nothing to build.
  # Plain clone like the rest of the no-UI modules instead of a release zip.
  - action: download_github
    src: https://github.com/SPiceZ21/spz-carspawner
    dest: ./resources/[spz]/spz-carspawner

  - action: download_file
    url: https://github.com/SPiceZ21/spz-nametag/releases/latest/download/spz-nametag.zip
    path: ./tmp/spz-nametag.zip
  - action: unzip
    src: ./tmp/spz-nametag.zip
    dest: ./resources/[spz]

  - action: download_file
    url: https://github.com/SPiceZ21/spz-speedometer/releases/latest/download/spz-speedometer.zip
    path: ./tmp/spz-speedometer.zip
  - action: unzip
    src: ./tmp/spz-speedometer.zip
    dest: ./resources/[spz]

  - action: download_github
    src: https://github.com/SPiceZ21/spz-rpc
    dest: ./resources/[spz]/spz-rpc

  - action: download_github
    src: https://github.com/SPiceZ21/spz-vehfunc
    dest: ./resources/[spz]/spz-vehfunc

  - action: download_github
    src: https://github.com/SPiceZ21/spz-speedcam
    dest: ./resources/[spz]/spz-speedcam

  - action: download_github
    src: https://github.com/SPiceZ21/spz-leaderboard
    dest: ./resources/[spz]/spz-leaderboard

  - action: download_github
    src: https://github.com/SPiceZ21/spz-fpscap
    dest: ./resources/[spz]/spz-fpscap

  - action: download_github
    src: https://github.com/SPiceZ21/spz-tunners
    dest: ./resources/[spz]/spz-tunners

  - action: download_github
    src: https://github.com/SPiceZ21/spz-spectate
    dest: ./resources/[spz]/spz-spectate

  - action: download_github
    src: https://github.com/SPiceZ21/spz-crew
    dest: ./resources/[spz]/spz-crew

  - action: download_github
    src: https://github.com/SPiceZ21/spz-chat
    dest: ./resources/[spz]/spz-chat

  - action: download_github
    src: https://github.com/SPiceZ21/spz-discord
    dest: ./resources/[spz]/spz-discord

  - action: download_github
    src: https://github.com/SPiceZ21/spz-raceline
    dest: ./resources/[spz]/spz-raceline

  # ── 5b. Minigames ─────────────────────────────────────────────────────────────
  - action: download_github
    src: https://github.com/SPiceZ21/spz-hideseek
    dest: ./resources/[spz]/spz-hideseek

  - action: download_github
    src: https://github.com/SPiceZ21/spz-pursuit
    dest: ./resources/[spz]/spz-pursuit

  # ── 6. Branding Assets ────────────────────────────────────────────────────────
  - action: copy_path
    src: ./tmp/recipe/Logo.png
    dest: ./Logo.png

  - action: copy_path
    src: ./tmp/recipe/permissions.cfg
    dest: ./permissions.cfg

  - action: copy_path
    src: ./tmp/recipe/Banner.png
    dest: ./Banner.png

  # ── 7. server.cfg ─────────────────────────────────────────────────────────────
  - action: copy_path
    src: ./tmp/recipe/server.cfg
    dest: ./server.cfg

  # ── 8. Cleanup ────────────────────────────────────────────────────────────────
  - action: remove_path
    path: ./tmp
